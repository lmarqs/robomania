<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1060" width="1400" height="1060" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Drift car: firmware architecture</title>
  <desc id="desc">How the ESP32 drift car's FreeRTOS tasks, cores, peripherals and GPIO pins connect a Bluetooth gamepad and an MPU6050 to the steering servo and the ESC.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1d2330; --muted:#5b6475; --line:#8a93a6; --chip:#f4f6fa; --chipline:#c9cfdb;
            --core0:#e8f0ff; --core0line:#5b8def; --core1:#e9f8ef; --core1line:#2f9e5b;
            --hw:#fff4e5; --hwline:#e08a1e; --ext:#f3eefc; --extline:#8a63d2; --warn:#c0392b; --shared:#fff9db; --sharedline:#c9a400; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#151922; --fg:#e6e9ef; --muted:#9aa3b5; --line:#6c7487; --chip:#1d2230; --chipline:#3a4256;
              --core0:#1a2640; --core0line:#6f9cf5; --core1:#17301f; --core1line:#4cc47e;
              --hw:#33260f; --hwline:#f0a040; --ext:#271f3a; --extline:#a888e8; --warn:#ff7b6b; --shared:#332d10; --sharedline:#e0c030; }
    }
    .bg { fill: var(--bg); }
    text { fill: var(--fg); }
    .t1 { font-size: 26px; font-weight: 700; }
    .t2 { font-size: 17px; font-weight: 700; }
    .t3 { font-size: 14px; font-weight: 600; }
    .tx { font-size: 13px; }
    .sm { font-size: 12px; fill: var(--muted); }
    .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 12.5px; }
    .chip { fill: var(--chip); stroke: var(--chipline); stroke-width: 1.5; }
    .core0 { fill: var(--core0); stroke: var(--core0line); stroke-width: 1.5; }
    .core1 { fill: var(--core1); stroke: var(--core1line); stroke-width: 1.5; }
    .hw { fill: var(--hw); stroke: var(--hwline); stroke-width: 1.5; }
    .ext { fill: var(--ext); stroke: var(--extline); stroke-width: 1.5; }
    .shared { fill: var(--shared); stroke: var(--sharedline); stroke-width: 1.5; }
    .task { fill: var(--bg); stroke-width: 1.5; }
    .t0 { stroke: var(--core0line); }
    .tA { stroke: var(--core1line); }
    .wire { stroke: var(--line); stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .wire2 { stroke: var(--line); stroke-width: 2; fill: none; marker-end: url(#arrow); marker-start: url(#arrowS); }
    .dash { stroke-dasharray: 6 5; }
    .warn { fill: var(--warn); }
    .warnline { stroke: var(--warn); }
    .pin { fill: var(--bg); stroke: var(--hwline); stroke-width: 1.5; }
    .step { fill: var(--core1line); }
    .steptext { fill: var(--bg); font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/></marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a93a6"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="1060"/>
  <text class="t1" x="40" y="48">Drift car — sketches/drift on an ESP32 WROOM-32</text>
  <text class="sm" x="40" y="72">Bluepad32 Arduino core 4.1.0 · FreeRTOS at 1000 Hz (1 tick = 1 ms) · task, core and priority values read from the core's sdkconfig and libraries</text>

  <!-- External: gamepad -->
  <rect class="ext" x="40" y="110" width="200" height="120" rx="12"/>
  <text class="t2" x="60" y="140">Gamepad</text>
  <text class="tx" x="60" y="164">Bluetooth Classic / BLE</text>
  <text class="sm" x="60" y="186">left stick X → steering</text>
  <text class="sm" x="60" y="203">right stick Y ↑ fwd · ↓ brake / rev</text>
  <text class="sm" x="60" y="220">D-pad ↑↓ → gyro gain ±0.1</text>

  <!-- ESP32 chip -->
  <rect class="chip" x="290" y="96" width="1070" height="560" rx="16"/>
  <text class="t2" x="310" y="124">ESP32 (dual-core Xtensa LX6, 240 MHz)</text>

  <!-- Radio -->
  <rect class="hw" x="310" y="140" width="150" height="74" rx="10"/>
  <text class="t3" x="324" y="164">BT radio</text>
  <text class="sm" x="324" y="184">BTDM controller</text>
  <text class="sm" x="324" y="200">via VHCI</text>
  <path class="wire" d="M240,172 L306,172"/>
  <text class="sm" x="246" y="164">2.4 GHz</text>

  <!-- Core 0 -->
  <rect class="core0" x="490" y="140" width="330" height="330" rx="12"/>
  <text class="t2" x="508" y="166">Core 0 — PRO_CPU</text>
  <text class="sm" x="508" y="185">Bluetooth lives here</text>

  <rect class="task t0" x="508" y="198" width="294" height="62" rx="8"/>
  <text class="t3" x="522" y="220">BT controller task</text>
  <text class="sm" x="522" y="240">ESP-IDF, pinned to core 0, high priority</text>
  <text class="sm" x="522" y="254">link layer, timing-critical radio work</text>

  <rect class="task t0" x="508" y="272" width="294" height="112" rx="8"/>
  <text class="t3" x="522" y="294">main task — BTstack run loop</text>
  <text class="mono" x="522" y="314">app_main(): btstack_init();</text>
  <text class="mono" x="522" y="330">  uni_init(); run_loop_execute();</text>
  <text class="sm" x="522" y="350">priority 1 · never returns · Bluepad32 parses</text>
  <text class="sm" x="522" y="366">HID reports into gamepad state</text>

  <rect class="task t0" x="508" y="396" width="294" height="58" rx="8"/>
  <text class="t3" x="522" y="418">IDLE0</text>
  <text class="sm" x="522" y="438">priority 0 · watched by the task watchdog</text>
  <text class="sm" x="522" y="452">(5 s → panic) if core 0 is starved</text>

  <path class="wire2" d="M460,177 L506,229"/>
  <path class="wire" d="M655,260 L655,270"/>

  <!-- Shared data -->
  <rect class="shared" x="490" y="490" width="330" height="76" rx="10"/>
  <text class="t3" x="508" y="514">Controller data + mutex</text>
  <text class="sm" x="508" y="534">BTstack writes each report; BP32.update()</text>
  <text class="sm" x="508" y="550">copies it out under the lock (a FreeRTOS queue)</text>
  <path class="wire" d="M508,350 H499 V488"/>
  <text class="sm" x="504" y="480">write</text>

  <!-- Core 1 -->
  <rect class="core1" x="850" y="140" width="490" height="500" rx="12"/>
  <text class="t2" x="868" y="166">Core 1 — APP_CPU</text>
  <text class="sm" x="868" y="185">the sketch lives here</text>

  <rect class="task tA" x="868" y="198" width="454" height="364" rx="8"/>
  <text class="t3" x="882" y="220">ArduinoTask — setup() once, then loop() forever</text>
  <text class="sm" x="882" y="238">created by Bluepad32 after BT init · priority 1 · 8 KB stack</text>

  <!-- loop steps -->
  <g>
    <circle class="step" cx="896" cy="266" r="11"/><text class="steptext" x="892" y="270">1</text>
    <text class="mono" x="916" y="263">BP32.update()</text>
    <text class="sm" x="916" y="279">copy pad data; run connect / disconnect callbacks</text>

    <circle class="step" cx="896" cy="310" r="11"/><text class="steptext" x="892" y="314">2</text>
    <text class="mono" x="916" y="307">adjustGain(dpad)</text>
    <text class="sm" x="916" y="323">edge on ↑/↓ → gain 0…1, printed to Serial</text>

    <circle class="step" cx="896" cy="354" r="11"/><text class="steptext" x="892" y="358">3</text>
    <text class="mono" x="916" y="351">esc.write((R2 − L2)/1023 × THROTTLE_MAX)</text>
    <text class="sm" x="916" y="367">PulseMotor: −1…1 → 1000…1500…2000 µs</text>

    <circle class="step" cx="896" cy="398" r="11"/><text class="steptext" x="892" y="402">4</text>
    <text class="mono" x="916" y="395">imu.read() → gzDps (yaw rate, °/s)</text>
    <text class="sm" x="916" y="411">blocking I2C read, 14 bytes, fails after 10 ms</text>

    <circle class="step" cx="896" cy="442" r="11"/><text class="steptext" x="892" y="446">5</text>
    <text class="mono" x="916" y="439">assist.steer(stick, gzDps, gain)</text>
    <text class="sm" x="916" y="455">stick − gain × gzDps / 200 °/s, clamped to ±1</text>

    <circle class="step" cx="896" cy="486" r="11"/><text class="steptext" x="892" y="490">6</text>
    <text class="mono" x="916" y="483">steering.write(steer)</text>
    <text class="sm" x="916" y="499">PulseOut: −1…1 → left / centre / right µs from config.h</text>

    <circle class="step" cx="896" cy="530" r="11"/><text class="steptext" x="892" y="534">7</text>
    <text class="mono" x="916" y="527">led.write(); delay(1)</text>
    <text class="sm" x="916" y="543">vTaskDelay(1 tick): blocks 1 ms, lets IDLE1 run</text>
  </g>

  <rect class="task tA" x="868" y="574" width="454" height="50" rx="8"/>
  <text class="t3" x="882" y="596">IDLE1</text>
  <text class="sm" x="882" y="614">priority 0 · runs while ArduinoTask sleeps in delay(1)</text>

  <path class="wire" d="M820,528 L866,272"/>
  <text class="sm" x="823" y="396">read</text>

  <!-- Failsafe note in chip -->
  <rect class="task" x="310" y="490" width="160" height="150" rx="8" style="stroke: var(--warn)"/>
  <text class="t3 warn" x="322" y="512">Failsafe</text>
  <text class="sm" x="322" y="532">On disconnect, the</text>
  <text class="sm" x="322" y="548">callback in step 1</text>
  <text class="sm" x="322" y="564">sends neutral throttle</text>
  <text class="sm" x="322" y="580">and centre steering.</text>
  <text class="sm" x="322" y="600">A stalled link holds</text>
  <text class="sm" x="322" y="616">the last command until</text>
  <text class="sm" x="322" y="632">Bluepad32 notices.</text>

  <!-- Peripherals row -->
  <text class="t2" x="40" y="700">Peripherals — written by ArduinoTask, running on their own in hardware between writes</text>

  <rect class="hw" x="40" y="716" width="430" height="140" rx="12"/>
  <text class="t3" x="58" y="740">LEDC — one timer, 50 Hz, 16-bit</text>
  <text class="sm" x="58" y="760">period 20 ms · step ≈ 0.3 µs · both channels share the timer</text>
  <text class="tx" x="58" y="786">channel 0 → steering servo pulse</text>
  <text class="tx" x="58" y="808">channel 1 → ESC pulse</text>
  <text class="sm" x="58" y="832">The pulse repeats in hardware; a write only changes</text>
  <text class="sm" x="58" y="848">the duty, so a slow loop never breaks the signal.</text>

  <rect class="hw" x="500" y="716" width="300" height="140" rx="12"/>
  <text class="t3" x="518" y="740">I2C0 (Wire) — 400 kHz</text>
  <text class="sm" x="518" y="760">master · timeout 10 ms</text>
  <text class="tx" x="518" y="786">SDA, SCL → MPU6050 @ 0x68</text>
  <text class="sm" x="518" y="808">read from ArduinoTask (step 4);</text>
  <text class="sm" x="518" y="824">gyro bias measured in setup()</text>
  <text class="sm" x="518" y="840">— car must stand still at boot</text>

  <rect class="hw" x="830" y="716" width="250" height="140" rx="12"/>
  <text class="t3" x="848" y="740">UART0 — 115200 baud</text>
  <text class="sm" x="848" y="760">USB serial on the dev board</text>
  <text class="tx" x="848" y="786">errors; with DRIFT_LOG 1:</text>
  <text class="tx" x="848" y="806">gamepad, status, gain, input</text>
  <text class="sm" x="848" y="830">Serial.printf from ArduinoTask</text>

  <rect class="hw" x="1110" y="716" width="250" height="140" rx="12"/>
  <text class="t3" x="1128" y="740">GPIO — BOARD_LED_PIN</text>
  <text class="tx" x="1128" y="766">steady: gamepad + IMU ok</text>
  <text class="tx" x="1128" y="786">short blink: IMU not ok</text>
  <text class="tx" x="1128" y="806">long blink: no gamepad</text>
  <text class="tx" x="1128" y="826">alternating: neither</text>


  <!-- Pins -->
  <g>
    <rect class="pin" x="150" y="868" width="80" height="28" rx="6"/><text class="mono" x="160" y="887">GPIO23</text>
    <rect class="pin" x="270" y="868" width="80" height="28" rx="6"/><text class="mono" x="280" y="887">GPIO21</text>
    <rect class="pin" x="520" y="868" width="80" height="28" rx="6"/><text class="mono" x="530" y="887">GPIO27</text>
    <rect class="pin" x="660" y="868" width="80" height="28" rx="6"/><text class="mono" x="670" y="887">GPIO26</text>
    <rect class="pin" x="860" y="868" width="80" height="28" rx="6"/><text class="mono" x="870" y="887">TX/RX</text>
    <rect class="pin" x="1195" y="868" width="80" height="28" rx="6"/><text class="mono" x="1212" y="887">GPIO2</text>
    <text class="sm" x="530" y="912">SDA</text><text class="sm" x="670" y="912">SCL</text>
  </g>

  <!-- Devices -->
  <rect class="ext" x="110" y="940" width="160" height="80" rx="10"/>
  <text class="t3" x="126" y="964">Steering servo</text>
  <text class="sm" x="126" y="984">1000–2000 µs</text>
  <text class="sm" x="126" y="1000">DRIFT_STEERING_PIN</text>
  <rect class="ext" x="290" y="940" width="180" height="80" rx="10"/>
  <text class="t3" x="306" y="964">Car ESC → motor</text>
  <text class="sm" x="306" y="984">armed at neutral 1500 µs</text>
  <text class="sm" x="306" y="1000">DRIFT_ESC_PIN</text>
  <rect class="ext" x="530" y="940" width="200" height="80" rx="10"/>
  <text class="t3" x="546" y="964">MPU6050</text>
  <text class="sm" x="546" y="984">±250 °/s · DLPF 44 Hz</text>
  <text class="sm" x="546" y="1000">Z axis up = yaw</text>
  <rect class="ext" x="800" y="940" width="200" height="80" rx="10"/>
  <text class="t3" x="816" y="964">PC serial monitor</text>
  <text class="sm" x="816" y="984">optional</text>

  <path class="wire" d="M190,896 L190,938"/>
  <path class="wire" d="M310,896 L370,938"/>
  <path class="wire2" d="M560,898 L590,938"/>
  <path class="wire" d="M700,898 L680,938"/>
  <path class="wire2" d="M900,898 L900,938"/>
  <path class="wire" d="M190,856 L190,866"/>
  <path class="wire" d="M310,856 L310,866"/>
  <path class="wire" d="M560,856 L560,866"/>
  <path class="wire" d="M700,856 L700,866"/>
  <path class="wire" d="M900,856 L900,866"/>
  <path class="wire" d="M1235,856 L1235,866"/>

</svg>
