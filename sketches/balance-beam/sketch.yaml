default_profile: wroom32

profiles:
  wroom32:
    fqbn: esp32:esp32:esp32:DebugLevel=info
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - dir: ../../lib
  c3:
    fqbn: esp32:esp32:esp32c3:DebugLevel=info,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - dir: ../../lib
